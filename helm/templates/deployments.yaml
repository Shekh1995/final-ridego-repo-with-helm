{{- $root := . }}
{{- range $service := list (dict "name" "ride" "port" 5001 "value" .Values.rideService "path" "/health") (dict "name" "booking" "port" 5002 "value" .Values.bookingService "path" "/health") (dict "name" "contact" "port" 5003 "value" .Values.contactService "path" "/health") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ridego.fullname" $root }}-{{ $service.name }}
  labels:
    {{- include "ridego.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  replicas: {{ $service.value.replicaCount }}
  selector:
    matchLabels:
      {{- include "ridego.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "ridego.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $service.name }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch }
      containers:
        - name: {{ $service.name }}
          image: "{{ $service.value.image.repository }}:{{ $service.value.image.tag }}"
          imagePullPolicy: {{ $service.value.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ $service.port }} }]
          {{- if eq $service.name "booking" }}
          env: [{ name: DB_PATH, value: /data/bookings.db }]
          volumeMounts: [{ name: data, mountPath: /data }]
          {{- else if eq $service.name "contact" }}
          env: [{ name: DB_PATH, value: /data/contact.db }]
          volumeMounts: [{ name: data, mountPath: /data }]
          {{- end }}
          readinessProbe: { httpGet: { path: {{ $service.path }}, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: {{ $service.path }}, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: {{- toYaml $service.value.resources | nindent 12 }}
      {{- if or (eq $service.name "booking") (eq $service.name "contact") }}
      volumes: [{ name: data, persistentVolumeClaim: { claimName: {{ include "ridego.fullname" $root }}-{{ $service.name }} } }]
      {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ridego.fullname" . }}-frontend
  labels:
    {{- include "ridego.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "ridego.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "ridego.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: {{ include "ridego.fullname" . }}-frontend } }]
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 8, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
