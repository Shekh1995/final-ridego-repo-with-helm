apiVersion: apps/v1
kind: Deployment
metadata: {name: contact-service, namespace: carshop}
spec:
  # SQLite uses a ReadWriteOnce volume, so this service must have one writer.
  replicas: 1
  selector: {matchLabels: {app: contact-service}}
  template:
    metadata: {labels: {app: contact-service}}
    spec:
      containers:
      - name: contact-service
        image: DOCKERHUB_USER/carshop-contact-service:latest
        imagePullPolicy: Always
        ports: [{containerPort: 5003}]
        envFrom: [{configMapRef: {name: carshop-config}}]
        env: [{name: DB_PATH, value: /data/contact.db}]
        readinessProbe: {httpGet: {path: /health, port: 5003}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 5003}, initialDelaySeconds: 15, periodSeconds: 20}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: contact-data}}
      securityContext: {fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch}
---
apiVersion: v1
kind: Service
metadata: {name: contact-service, namespace: carshop}
spec:
  selector: {app: contact-service}
  ports: [{port: 5003, targetPort: 5003}]
