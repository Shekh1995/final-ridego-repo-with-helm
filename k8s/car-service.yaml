apiVersion: apps/v1
kind: Deployment
metadata: {name: car-service, namespace: carshop}
spec:
  replicas: 2
  selector: {matchLabels: {app: car-service}}
  template:
    metadata: {labels: {app: car-service}}
    spec:
      containers:
      - name: car-service
        image: DOCKERHUB_USER/carshop-car-service:latest
        imagePullPolicy: Always
        ports: [{containerPort: 5001}]
        envFrom: [{configMapRef: {name: carshop-config}}]
        readinessProbe: {httpGet: {path: /health, port: 5001}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 5001}, initialDelaySeconds: 15, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: car-service, namespace: carshop}
spec:
  selector: {app: car-service}
  ports: [{port: 5001, targetPort: 5001}]
