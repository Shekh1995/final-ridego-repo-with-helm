apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: carshop}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: DOCKERHUB_USER/carshop-frontend:latest
        imagePullPolicy: Always
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: carshop-config}}]
        readinessProbe: {httpGet: {path: /ready, port: 8080}, initialDelaySeconds: 8, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 20, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: frontend-external, namespace: carshop}
spec:
  type: LoadBalancer
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 8080}]
